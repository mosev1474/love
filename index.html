<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>اختاري ❤️</title>
  <style>
    body {
      text-align: center;
      font-family: Arial;
      background: #ffe6eb;
      padding-top: 100px;
    }

    h1 {
      margin-bottom: 40px;
    }

    button {
      display: block;
      margin: 20px auto;
      padding: 15px 30px;
      font-size: 18px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: 0.3s;
    }

    .old {
      background-color: #ff4d6d;
      color: white;
    }

    .new {
      background-color: #6a5acd;
      color: white;
    }

    button:hover {
      transform: scale(1.1);
    }
  </style>
</head>

<body>

  <h1>اختاري اللي تحبيه ❤️</h1>

  <button class="old" onclick="goOld()">يــوم عيد الحب 🥰</button>
  <button class="new" onclick="goNew()">بـصالحك ي دكتوره حسـونه 🥺</button>

  <script>
    function goOld() {
      window.location.href = "old.html";
    }

    function goNew() {
      window.location.href = "https://username.github.io/new-project";
    }
  </script>

</body>
</html>
